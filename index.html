<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeGrandArt - La Plateforme des 7 Arts</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    @keyframes kenburns {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .animate-kenburns {
      animation: kenburns 30s ease-in-out infinite alternate;
    }

    /* Custom scrollbar for modern dark feel */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans antialiased selection:bg-rose-500/30 selection:text-rose-200 min-h-screen">
  
  <!-- Root Container for React App -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Lucide Icon Replacements (Clean SVG Components) ---
    const Landmark = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/>
      </svg>
    );

    const Hammer = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m15 12-8.5 8.5a2.12 2.12 0 0 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 3.66-1.57-1.57a2.64 2.64 0 0 0-3.73 0L12 5.76l5.66 5.66 3.25-3.25a2.64 2.64 0 0 0 0-3.73Z"/>
      </svg>
    );

    const Palette = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.7-.71 1.7-1.63 0-.44-.18-.85-.47-1.15a1.64 1.64 0 0 1-.47-1.16c0-.92.75-1.66 1.67-1.66h2.24c2.94 0 5.33-2.39 5.33-5.33C22 6.44 17.52 2 12 2Z"/>
      </svg>
    );

    const BookOpen = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    );

    const Music = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    );

    const Mic2 = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m12 8-9.04 9.06a2.82 2.82 0 1 0 3.98 3.98L16 12"/><circle cx="17" cy="7" r="5"/>
      </svg>
    );

    const Film = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M17 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>
      </svg>
    );

    const Menu = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    );

    const X = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    );

    const ArrowRight = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
      </svg>
    );

    const Instagram = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
      </svg>
    );

    const Twitter = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>
      </svg>
    );

    const Facebook = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
      </svg>
    );

    const CheckCircle = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    );

    const XCircle = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
      </svg>
    );

    const User = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    );

    const Mail = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    );

    const Lock = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );

    const Phone = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    );

    const ARTS_DATA = [
      {
        id: 1,
        title: 'Architecture',
        frenchTitle: 'Architecture',
        description: "L'art et la science de concevoir des bâtiments et des structures, alliant esthétique et fonctionnalité pour façonner notre environnement.",
        icon: Landmark,
        color: 'from-stone-400 to-stone-600',
        bgLight: 'bg-stone-500/10',
        textCol: 'text-stone-400',
        image: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=800'
      },
      {
        id: 2,
        title: 'Sculpture',
        frenchTitle: 'Sculpture',
        description: "La branche des arts visuels qui opère en trois dimensions, transformant la matière brute en formes expressives.",
        icon: Hammer,
        color: 'from-amber-500 to-amber-700',
        bgLight: 'bg-amber-500/10',
        textCol: 'text-amber-500',
        image: 'https://images.unsplash.com/photo-1544531586-fde5298cdd40?auto=format&fit=crop&q=80&w=800'
      },
      {
        id: 3,
        title: 'Painting',
        frenchTitle: 'Peinture',
        description: "L'art d'appliquer des pigments sur une surface pour créer des images, capturant la lumière, l'émotion et l'imagination.",
        icon: Palette,
        color: 'from-rose-500 to-rose-700',
        bgLight: 'bg-rose-500/10',
        textCol: 'text-rose-500',
        image: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&q=80&w=800'
      },
      {
        id: 4,
        title: 'Literature',
        frenchTitle: 'Littérature',
        description: "L'art de l'expression écrite ou orale, utilisant les mots pour raconter des histoires, partager des idées et explorer la condition humaine.",
        icon: BookOpen,
        color: 'from-emerald-400 to-emerald-600',
        bgLight: 'bg-emerald-500/10',
        textCol: 'text-emerald-400',
        image: 'https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&q=80&w=800'
      },
      {
        id: 5,
        title: 'Music',
        frenchTitle: 'Musique',
        description: "L'art d'arranger les sons dans le temps pour produire une composition à travers la mélodie, l'harmonie, le rythme et le timbre.",
        icon: Music,
        color: 'from-violet-500 to-violet-700',
        bgLight: 'bg-violet-500/10',
        textCol: 'text-violet-500',
        image: 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&q=80&w=800'
      },
      {
        id: 6,
        title: 'Performing Arts',
        frenchTitle: 'Arts de la Scène',
        description: "Des formes d'art où les artistes utilisent leur corps, leur voix ou des objets pour transmettre une expression artistique au public.",
        icon: Mic2,
        color: 'from-orange-400 to-orange-600',
        bgLight: 'bg-orange-500/10',
        textCol: 'text-orange-400',
        image: 'https://images.unsplash.com/photo-1507676184212-d0330a15233c?auto=format&fit=crop&q=80&w=800'
      },
      {
        id: 7,
        title: 'Cinema',
        frenchTitle: 'Cinéma',
        description: "Le septième art. L'art de simuler des expériences pour communiquer des idées et des émotions à travers des images en mouvement.",
        icon: Film,
        color: 'from-cyan-400 to-cyan-600',
        bgLight: 'bg-cyan-500/10',
        textCol: 'text-cyan-400',
        image: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&q=80&w=800'
      },
    ];

    const AuthModal = ({ isOpen, type, onClose, setType }) => {
      const [submittedMsg, setSubmittedMsg] = useState('');
      if (!isOpen) return null;

      const isLogin = type === 'login';

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmittedMsg(isLogin ? "Connexion réussie !" : "Compte créé avec succès !");
        setTimeout(() => {
          setSubmittedMsg('');
          onClose();
        }, 1500);
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6">
          <div className="absolute inset-0 bg-black/80 backdrop-blur-md transition-opacity" onClick={onClose}></div>
          
          <div className="relative w-full max-w-4xl bg-zinc-950 border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row transition-all transform scale-100">
            {/* Left Column - Branding/Visual */}
            <div className="hidden md:flex w-1/2 relative p-12 flex-col justify-between bg-zinc-900 border-r border-zinc-800">
              <div className="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_left,_var(--tw-gradient-stops))] from-emerald-500 via-teal-900 to-transparent mix-blend-screen"></div>
              
              <div className="relative z-10 flex items-center gap-2">
                <span className="text-2xl md:text-4xl font-black text-white logo-text">
                  LeGrand<span className="text-yellow-500">Art</span>
                </span>
              </div>

              <div className="relative z-10 mt-12">
                <h3 className="text-3xl font-bold text-white mb-4 leading-tight">
                  Exposez votre art.<br/>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">Conservez 88%.</span>
                </h3>
                <p className="text-zinc-400 mb-8">
                  Rejoignez la seule plateforme conçue pour les 7 disciplines artistiques avec les commissions les plus basses du marché.
                </p>
                <div className="space-y-4">
                  <div className="flex items-center gap-3 text-sm text-zinc-300">
                    <CheckCircle className="text-emerald-500 shrink-0" size={20} />
                    <span>Création de profil 100% gratuite</span>
                  </div>
                  <div className="flex items-center gap-3 text-sm text-zinc-300">
                    <CheckCircle className="text-emerald-500 shrink-0" size={20} />
                    <span>Vente directe aux collectionneurs</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Right Column - Form */}
            <div className="w-full md:w-1/2 p-8 md:p-12 relative bg-zinc-950">
              <button 
                onClick={onClose} 
                className="absolute top-6 right-6 p-2 text-zinc-500 hover:text-white hover:bg-zinc-900 rounded-full transition-colors"
                aria-label="Fermer"
              >
                <X size={20} />
              </button>

              <div className="max-w-sm mx-auto w-full">
                <h2 className="text-2xl font-bold text-white mb-2">
                  {isLogin ? 'Bon retour parmi nous' : 'Créer un compte'}
                </h2>
                <p className="text-zinc-400 text-sm mb-8">
                  {isLogin ? 'Connectez-vous pour gérer vos œuvres.' : 'Rejoignez notre communauté de créateurs.'}
                </p>

                {submittedMsg && (
                  <div className="mb-6 p-4 rounded-xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 text-sm font-medium text-center">
                    {submittedMsg}
                  </div>
                )}

                {/* Tabs */}
                <div className="flex p-1 bg-zinc-900 rounded-xl mb-8">
                  <button 
                    type="button"
                    onClick={() => setType('login')}
                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${isLogin ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}
                  >
                    Se connecter
                  </button>
                  <button 
                    type="button"
                    onClick={() => setType('register')}
                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${!isLogin ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}
                  >
                    S'inscrire
                  </button>
                </div>

                <form className="space-y-5" onSubmit={handleSubmit}>
                  {!isLogin && (
                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1.5">Nom complet</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500">
                          <User size={18} />
                        </div>
                        <input type="text" required className="w-full pl-10 pr-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-all" placeholder="Léonard de Vinci" />
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-medium text-zinc-400 mb-1.5">Adresse email</label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500">
                        <Mail size={18} />
                      </div>
                      <input type="email" required className="w-full pl-10 pr-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-all" placeholder="leonard@florence.art" />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-xs font-medium text-zinc-400">Mot de passe</label>
                      {isLogin && <a href="#forgot" onClick={(e) => e.preventDefault()} className="text-xs text-zinc-500 hover:text-white transition-colors">Oublié ?</a>}
                    </div>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500">
                        <Lock size={18} />
                      </div>
                      <input type="password" required className="w-full pl-10 pr-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-all" placeholder="••••••••" />
                    </div>
                  </div>

                  {!isLogin && (
                    <div className="pt-2">
                      <label className="block text-xs font-medium text-zinc-400 mb-3">Je suis un...</label>
                      <div className="grid grid-cols-2 gap-3">
                        <label className="cursor-pointer">
                          <input type="radio" name="role" className="peer sr-only" defaultChecked />
                          <div className="text-center px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-sm font-medium text-zinc-400 peer-checked:bg-emerald-500/10 peer-checked:border-emerald-500/50 peer-checked:text-emerald-400 transition-all hover:bg-zinc-800">
                            Artiste
                          </div>
                        </label>
                        <label className="cursor-pointer">
                          <input type="radio" name="role" className="peer sr-only" />
                          <div className="text-center px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-sm font-medium text-zinc-400 peer-checked:bg-cyan-500/10 peer-checked:border-cyan-500/50 peer-checked:text-cyan-400 transition-all hover:bg-zinc-800">
                            Collectionneur
                          </div>
                        </label>
                      </div>
                    </div>
                  )}

                  <button type="submit" className="w-full py-3.5 mt-2 bg-white text-black font-semibold rounded-xl hover:bg-zinc-200 transition-colors shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                    {isLogin ? 'Se connecter' : 'Créer mon compte'}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Header = ({ isScrolled, openAuth }) => {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      return (
        <header 
          className={`fixed top-0 left-0 w-full z-50 transition-all duration-300 ${
            isScrolled ? 'bg-zinc-950/80 backdrop-blur-md py-4 border-b border-zinc-800/50' : 'bg-transparent py-6'
          }`}
        >
          <div className="max-w-7xl mx-auto px-6 md:px-12 flex justify-between items-center">
            {/* Logo */}
            <a href="#accueil" className="flex items-center gap-2 group cursor-pointer">
              <span className="text-2xl md:text-4xl font-black text-white logo-text group-hover:scale-105 transition-transform">
                LeGrand<span className="text-yellow-500">Art</span>
              </span>
            </a>

            {/* Desktop Nav */}
            <nav className="hidden md:flex items-center gap-8">
              {['Accueil', 'Les Arts', 'Expositions', 'Artistes', 'Contact'].map((item) => (
                <a 
                  key={item} 
                  href={`#${item.toLowerCase().replace(' ', '')}`}
                  className="text-sm font-medium text-zinc-400 hover:text-white transition-colors relative after:absolute after:bottom-[-4px] after:left-0 after:h-[2px] after:w-0 after:bg-white hover:after:w-full after:transition-all after:duration-300"
                >
                  {item}
                </a>
              ))}
            </nav>

            {/* Action Buttons */}
            <div className="hidden md:flex items-center gap-4">
              <button onClick={() => openAuth('login')} className="text-sm font-medium text-white hover:text-zinc-300 transition-colors">
                Se connecter
              </button>
              <button onClick={() => openAuth('register')} className="px-5 py-2 rounded-full bg-white text-black font-semibold text-sm hover:bg-zinc-200 transition-colors">
                S'inscrire
              </button>
            </div>

            {/* Mobile Menu Toggle */}
            <button 
              className="md:hidden text-zinc-400 hover:text-white transition-colors p-1"
              onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
              aria-label="Toggle Navigation Menu"
            >
              {isMobileMenuOpen ? <X size={28} /> : <Menu size={28} />}
            </button>
          </div>

          {/* Mobile Nav Drawer */}
          <div className={`md:hidden absolute top-full left-0 w-full bg-zinc-950 border-b border-zinc-800/50 transition-all duration-300 overflow-hidden ${isMobileMenuOpen ? 'max-h-96 py-4' : 'max-h-0 py-0'}`}>
            <div className="flex flex-col px-6 gap-4">
              {['Accueil', 'Les Arts', 'Expositions', 'Artistes', 'Contact'].map((item) => (
                <a 
                  key={item} 
                  href={`#${item.toLowerCase().replace(' ', '')}`}
                  className="text-lg font-medium text-zinc-400 hover:text-white transition-colors"
                  onClick={() => setIsMobileMenuOpen(false)}
                >
                  {item}
                </a>
              ))}
              <div className="flex flex-col gap-3 mt-4 border-t border-zinc-800/50 pt-4">
                <button onClick={() => { openAuth('login'); setIsMobileMenuOpen(false); }} className="px-6 py-3 rounded-full bg-zinc-900 border border-zinc-700 text-white font-semibold w-full text-center hover:bg-zinc-800 transition-colors">
                  Se connecter
                </button>
                <button onClick={() => { openAuth('register'); setIsMobileMenuOpen(false); }} className="px-6 py-3 rounded-full bg-white text-black font-semibold w-full text-center hover:bg-zinc-200 transition-colors">
                  S'inscrire
                </button>
              </div>
            </div>
          </div>
        </header>
      );
    };

    const Hero = ({ openAuth }) => {
      return (
        <section id="accueil" className="relative min-h-screen flex items-center justify-center pt-24 overflow-hidden bg-zinc-950">

          {/* Animated Background Image */}
          <div className="absolute inset-0 z-0 overflow-hidden pointer-events-none">
            <div 
              className="w-full h-full bg-cover bg-center animate-kenburns"
              style={{
                backgroundImage: "url('https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&q=80&w=1920')"
              }}
            />
            {/* Dark overlay to ensure text remains readable */}
            <div className="absolute inset-0 bg-zinc-950/80" />
          </div>

          <div className="relative z-10 max-w-7xl mx-auto px-6 md:px-12 flex flex-col items-center text-center">
            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-zinc-900/50 border border-zinc-800 mb-8 backdrop-blur-sm">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span className="text-xs font-medium text-zinc-300 uppercase tracking-wider">Pour les Artistes & Collectionneurs</span>
            </div>
            
            <h1 className="text-5xl md:text-7xl lg:text-8xl font-black text-white tracking-tight mb-6 leading-tight">
              Exposez votre art. <br className="hidden md:block" />
              <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-500 to-cyan-500">
                Conservez 88% de chaque vente.
              </span>
            </h1>
            
            <p className="text-lg md:text-xl text-zinc-400 max-w-3xl mb-10 font-light leading-relaxed">
              La seule plateforme conçue pour les sept disciplines artistiques. Créez votre profil gratuit, listez vos œuvres et vendez directement aux collectionneurs du monde entier — avec les commissions les plus basses du marché.
            </p>

            <div className="flex flex-col md:flex-row items-start md:items-center justify-center gap-4 md:gap-6 mb-12 text-sm font-medium text-zinc-300 bg-zinc-900/40 p-6 rounded-2xl border border-zinc-800/50 backdrop-blur-sm w-full md:w-auto text-left">
              <div className="flex items-center gap-3">
                <CheckCircle className="text-emerald-500 shrink-0" size={20} />
                <span>Inscription gratuite</span>
              </div>
              <div className="hidden md:block w-1.5 h-1.5 rounded-full bg-zinc-700"></div>
              <div className="flex items-center gap-3">
                <CheckCircle className="text-emerald-500 shrink-0" size={20} />
                <span>12% de commission uniquement lors d'une vente</span>
              </div>
              <div className="hidden md:block w-1.5 h-1.5 rounded-full bg-zinc-700"></div>
              <div className="flex items-center gap-3 text-zinc-500">
                <XCircle className="text-rose-500/70 shrink-0" size={20} />
                <span>contre 35–45% sur d'autres plateformes</span>
              </div>
            </div>
            
            <div className="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
              <button onClick={() => openAuth('register')} className="px-8 py-4 rounded-full bg-white text-black font-bold text-lg hover:bg-zinc-200 transition-all flex items-center justify-center gap-2 group">
                Créer un Profil Gratuit
                <ArrowRight size={20} className="group-hover:translate-x-1 transition-transform" />
              </button>
              <a href="#expositions" className="px-8 py-4 rounded-full bg-zinc-900 border border-zinc-700 text-white font-semibold text-lg hover:bg-zinc-800 hover:border-zinc-600 transition-all flex items-center justify-center gap-2">
                Explorer le Marché
              </a>
            </div>
          </div>

          {/* Scroll indicator */}
          <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 animate-bounce opacity-50">
            <span className="text-xs text-zinc-400 uppercase tracking-widest">Défiler</span>
            <div className="w-px h-12 bg-gradient-to-b from-zinc-400 to-transparent"></div>
          </div>
        </section>
      );
    };

    const ArtsSection = () => {
      return (
        <section id="lesarts" className="py-24 bg-zinc-950 relative">
          <div className="max-w-7xl mx-auto px-6 md:px-12">
            <div className="flex flex-col md:flex-row justify-between items-end mb-16 gap-8">
              <div className="max-w-2xl">
                <h2 className="text-3xl md:text-5xl font-bold text-white mb-6">Les Sept Piliers de la <span className="text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-violet-500">Création</span></h2>
                <p className="text-zinc-400 text-lg">
                  Depuis l'antiquité jusqu'à l'ère moderne, ces sept disciplines ont défini notre façon de comprendre, d'exprimer et de documenter l'expérience humaine.
                </p>
              </div>
              <p className="text-6xl md:text-8xl font-black text-zinc-800/50 hidden lg:block select-none">07</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
              {ARTS_DATA.map((art, index) => {
                const Icon = art.icon;
                const isLast = index === 6;
                
                return (
                  <div 
                    key={art.id}
                    className={`group relative rounded-3xl bg-zinc-900/50 border border-zinc-800/50 hover:border-zinc-700/50 transition-all duration-500 overflow-hidden flex flex-col h-full ${
                      isLast ? 'xl:col-span-2 xl:flex-row' : ''
                    }`}
                  >
                    {/* Background glow effect on hover */}
                    <div className={`absolute inset-0 bg-gradient-to-br ${art.color} opacity-0 group-hover:opacity-10 transition-opacity duration-500 pointer-events-none z-10`}></div>
                    
                    {/* Image Section */}
                    <div className={`relative overflow-hidden ${isLast ? 'h-64 xl:h-auto xl:w-5/12' : 'h-56 w-full'}`}>
                      <img src={art.image} alt={art.frenchTitle} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-80 group-hover:opacity-100" />
                      <div className={`absolute inset-0 bg-gradient-to-t from-zinc-900 via-zinc-900/40 to-transparent ${isLast ? 'xl:bg-gradient-to-r' : ''}`}></div>
                      
                      <div className="absolute bottom-6 left-6 z-20">
                        <div className={`w-14 h-14 rounded-2xl ${art.bgLight} backdrop-blur-md flex items-center justify-center border border-white/10 group-hover:scale-110 transition-transform duration-500`}>
                          <Icon size={28} className={`${art.textCol}`} />
                        </div>
                      </div>
                    </div>

                    {/* Text Section */}
                    <div className={`p-8 flex-grow flex flex-col relative z-20 ${isLast ? 'xl:w-7/12 xl:justify-center' : ''}`}>
                      <div className="flex items-baseline gap-4 mb-4">
                        <span className="text-zinc-600 font-mono text-sm font-bold">0{art.id}</span>
                        <h3 className="text-2xl font-bold text-white">{art.frenchTitle}</h3>
                      </div>

                      <p className="text-zinc-400 mb-8 flex-grow leading-relaxed">
                        {art.description}
                      </p>
                      
                      <a href={`#${art.frenchTitle.toLowerCase().replace(' ', '')}`} className="inline-flex items-center gap-2 text-sm font-semibold text-white mt-auto group/link w-fit">
                        Découvrir 
                        <ArrowRight size={16} className={`group-hover/link:translate-x-1 transition-transform ${art.textCol}`} />
                      </a>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    };

    const FeaturedSection = () => {
      return (
        <section id="expositions" className="py-24 bg-zinc-900 border-y border-zinc-800/50">
          <div className="max-w-7xl mx-auto px-6 md:px-12">
            <div className="text-center mb-16">
              <h2 className="text-3xl md:text-5xl font-bold text-white mb-6">En Vedette</h2>
              <p className="text-zinc-400 text-lg max-w-2xl mx-auto">
                Découvrez les œuvres marquantes et les créateurs contemporains qui repoussent les limites des sept arts.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              {/* Card 1 */}
              <div className="group cursor-pointer rounded-3xl overflow-hidden relative aspect-video">
                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-10"></div>
                <div className="absolute inset-0 bg-stone-800 group-hover:scale-105 transition-transform duration-700 flex items-center justify-center">
                   <div className="text-stone-700 font-bold text-3xl md:text-4xl opacity-50 text-center px-4">Exposition Architecturale</div>
                </div>
                
                <div className="absolute bottom-0 left-0 p-8 z-20 w-full">
                  <span className="inline-block px-3 py-1 rounded-full bg-stone-500/20 text-stone-300 text-xs font-bold tracking-wider uppercase mb-3 backdrop-blur-md border border-stone-500/30">
                    Architecture
                  </span>
                  <h3 className="text-2xl md:text-3xl font-bold text-white mb-2">Symbiose Urbaine</h3>
                  <p className="text-zinc-300 text-sm max-w-md">L'intégration de la nature dans les structures métropolitaines de demain.</p>
                </div>
              </div>

              {/* Card 2 */}
              <div className="group cursor-pointer rounded-3xl overflow-hidden relative aspect-video">
                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-10"></div>
                <div className="absolute inset-0 bg-cyan-900 group-hover:scale-105 transition-transform duration-700 flex items-center justify-center">
                   <div className="text-cyan-800 font-bold text-3xl md:text-4xl opacity-50 text-center px-4">Festival de Cinéma</div>
                </div>
                
                <div className="absolute bottom-0 left-0 p-8 z-20 w-full">
                  <span className="inline-block px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 text-xs font-bold tracking-wider uppercase mb-3 backdrop-blur-md border border-cyan-500/30">
                    Cinéma
                  </span>
                  <h3 className="text-2xl md:text-3xl font-bold text-white mb-2">Festival Nouvelles Vagues</h3>
                  <p className="text-zinc-300 text-sm max-w-md">Une rétrospective des courts-métrages indépendants primés cette année.</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const Footer = () => {
      const [newsletterEmail, setNewsletterEmail] = useState('');
      const [newsletterSubscribed, setNewsletterSubscribed] = useState(false);

      const handleNewsletterSubmit = (e) => {
        e.preventDefault();
        if (newsletterEmail) {
          setNewsletterSubscribed(true);
          setNewsletterEmail('');
          setTimeout(() => setNewsletterSubscribed(false), 3000);
        }
      };

      return (
        <footer id="contact" className="bg-zinc-950 pt-24 pb-12 border-t border-zinc-800/50">
          <div className="max-w-7xl mx-auto px-6 md:px-12">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 mb-16">
              <div className="lg:col-span-1">
                <div className="flex items-center gap-2 mb-6">
                  <span className="text-2xl md:text-4xl font-black text-white logo-text">
                    LeGrand<span className="text-yellow-500">Art</span>
                  </span>
                </div>
                <p className="text-zinc-400 text-sm mb-6 leading-relaxed">
                  La plateforme de référence pour l'exploration et la célébration des sept disciplines artistiques majeures.
                </p>
                <div className="mb-6 space-y-3 text-sm text-zinc-300">
                  <a href="mailto:elietwikala@legrandart.org" className="flex items-center gap-3 hover:text-yellow-500 transition-colors">
                    <Mail size={18} className="text-yellow-500" /> 
                    elietwikala@legrandart.org
                  </a>
                  <a href="tel:+243815022325" className="flex items-center gap-3 hover:text-yellow-500 transition-colors">
                    <Phone size={18} className="text-yellow-500" /> 
                    +243 815 022 325
                  </a>
                </div>
                <div className="flex gap-4">
                  <a href="#twitter" onClick={(e) => e.preventDefault()} aria-label="Twitter" className="w-10 h-10 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-400 hover:bg-zinc-800 hover:text-white transition-colors">
                    <Twitter size={18} />
                  </a>
                  <a href="#instagram" onClick={(e) => e.preventDefault()} aria-label="Instagram" className="w-10 h-10 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-400 hover:bg-zinc-800 hover:text-white transition-colors">
                    <Instagram size={18} />
                  </a>
                  <a href="#facebook" onClick={(e) => e.preventDefault()} aria-label="Facebook" className="w-10 h-10 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-400 hover:bg-zinc-800 hover:text-white transition-colors">
                    <Facebook size={18} />
                  </a>
                </div>
              </div>

              <div>
                <h4 className="text-white font-bold mb-6">Les Disciplines</h4>
                <ul className="space-y-3">
                  {ARTS_DATA.slice(0, 4).map(art => (
                    <li key={art.id}>
                      <a href={`#${art.frenchTitle.toLowerCase().replace(' ', '')}`} className="text-zinc-400 hover:text-white transition-colors text-sm">
                        {art.frenchTitle}
                      </a>
                    </li>
                  ))}
                </ul>
              </div>

              <div>
                <h4 className="text-zinc-950 font-bold mb-6 select-none md:block hidden">.</h4>
                <ul className="space-y-3">
                  {ARTS_DATA.slice(4).map(art => (
                    <li key={art.id}>
                      <a href={`#${art.frenchTitle.toLowerCase().replace(' ', '')}`} className="text-zinc-400 hover:text-white transition-colors text-sm">
                        {art.frenchTitle}
                      </a>
                    </li>
                  ))}
                </ul>
              </div>

              <div>
                <h4 className="text-white font-bold mb-6">Newsletter</h4>
                <p className="text-zinc-400 text-sm mb-4">
                  Restez informé des dernières expositions et actualités culturelles.
                </p>
                {newsletterSubscribed ? (
                  <div className="p-3 rounded-xl bg-emerald-500/20 text-emerald-400 text-xs font-medium text-center border border-emerald-500/30">
                    Merci pour votre abonnement !
                  </div>
                ) : (
                  <form className="flex flex-col gap-3" onSubmit={handleNewsletterSubmit}>
                    <input 
                      type="email" 
                      required
                      value={newsletterEmail}
                      onChange={(e) => setNewsletterEmail(e.target.value)}
                      placeholder="Votre adresse email" 
                      className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition-colors"
                    />
                    <button type="submit" className="w-full px-4 py-3 rounded-xl bg-white text-black font-semibold hover:bg-zinc-200 transition-colors">
                      S'abonner
                    </button>
                  </form>
                )}
              </div>
            </div>

            <div className="pt-8 border-t border-zinc-800/50 flex flex-col md:flex-row justify-between items-center gap-4">
              <p className="text-zinc-500 text-sm">
                © {new Date().getFullYear()} Le Grand Art. Tous droits réservés.
              </p>
              <div className="flex gap-6 text-sm text-zinc-500">
                <a href="#privacy" onClick={(e) => e.preventDefault()} className="hover:text-zinc-300 transition-colors">Politique de confidentialité</a>
                <a href="#terms" onClick={(e) => e.preventDefault()} className="hover:text-zinc-300 transition-colors">Mentions légales</a>
              </div>
            </div>
          </div>
        </footer>
      );
    };

    function App() {
      const [isScrolled, setIsScrolled] = useState(false);
      const [authModal, setAuthModal] = useState({ isOpen: false, type: 'register' });

      // Handle scroll event for dynamic header styling
      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 50) {
            setIsScrolled(true);
          } else {
            setIsScrolled(false);
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-50 font-sans selection:bg-rose-500/30 selection:text-rose-200 scroll-smooth">
          <Header isScrolled={isScrolled} openAuth={(type) => setAuthModal({ isOpen: true, type })} />
          <main>
            <Hero openAuth={(type) => setAuthModal({ isOpen: true, type })} />
            <ArtsSection />
            <FeaturedSection />
          </main>
          <Footer />
          
          <AuthModal 
            isOpen={authModal.isOpen} 
            type={authModal.type} 
            onClose={() => setAuthModal({ ...authModal, isOpen: false })} 
            setType={(type) => setAuthModal({ ...authModal, type })} 
          />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
